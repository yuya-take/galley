name: 機能の提案
description: 新しい機能や改善を提案する
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何に困っているかを書いてください
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: どうなると解決するかを書いてください
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: ほかに考えた方法
