[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/yuya-take/galley"
publish = false

[workspace.dependencies]
galley-core = { path = "crates/core" }
galley-web = { path = "crates/web" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
axum = "0.8.9"
rmcp = { version = "3.4.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
topcoat = { version = "0.9.0", default-features = false }
http = "1"
jiff = "0.2"
lol_html = "3.0.1"
htmlize = { version = "1.1.0", features = ["unescape"] }
cssparser = "0.38.0"
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws"] }
sha2 = "0.11"
thiserror = "2"
toasty = { version = "0.11.0", default-features = false, features = ["sqlite", "jiff", "migration"] }
toasty-cli = "0.11.0"
toasty-core = "0.11.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
