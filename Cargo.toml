[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/yuya-take/galley"
publish = false

[workspace.dependencies]
galley-core = { path = "crates/core" }
galley-web = { path = "crates/web" }
anyhow = "1"
axum = "0.8.9"
rmcp = { version = "3.4.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
topcoat = { version = "0.9.0", default-features = false }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
